# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: workload
displayName: Pi (OpenAI Codex)
description: Pi coding agent configured for OpenAI Codex OAuth

build: |
  FROM docker.io/vposvistelik/sbx-kit-pi:0.8.0

capabilities:
  - type: com.docker.sandbox/sbx@1
  - type: com.docker.sandbox/agent-context@1
    config:
      filename: AGENTS.md
      content: |
        This is a Docker Sandbox with Docker access and passwordless sudo.

        ## Host Git commits

        For a user-requested commit using the Docker Host's Git identity and signing
        configuration, use the host_git_commit tool when available. It requires
        host opt-in for git.commit and desktop approval; never request or transmit
        a signing passphrase. If the tool is missing or permission is denied,
        explain that host setup is required; do not bypass it with queue writes.

        Stage only intended files, then obtain expectedHead with git rev-parse HEAD
        (use "unborn" for an initial commit) and expectedTree with git write-tree.
        Call host_git_commit with message, expectedHead and expectedTree. The host
        HEAD and staged tree must match: direct mode shares Git state, but a clone's
        index is separate and this tool does not synchronize it. The tool requests
        review and commits only the approved snapshot; it does not stage or push.
        After an error, cancellation or timeout, inspect host Git state before any
        further request; never automatically retry. Respect a declined approval.
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - auth.openai.com
          - chatgpt.com
  - type: com.docker.sandbox/credential@1
    description: OAuth credentials used by Pi's OpenAI Codex provider
    config:
      service: openai-codex
      phase: runtime
      oauth:
        tokenEndpoint:
          host: auth.openai.com
          path: /oauth/token
        credentialFile:
          path: "~/.pi/agent/auth.json"
          structure:
            openai-codex:
              type: oauth
              access: "{{.AccessToken}}"
              refresh: "{{.RefreshToken}}"
              expires: "{{.ExpiresAt}}"
        responseFields:
          accessToken: access_token
          refreshToken: refresh_token
          expiresIn: expires_in
        passthrough: true
