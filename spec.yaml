schemaVersion: "2"
kind: sandbox
name: pi-openai-codex
displayName: Pi (OpenAI Codex)
description: Pi coding agent configured for OpenAI Codex OAuth

sandbox:
  image: sbx-kit-pi:0.84.2
  entrypoint:
    - pi
    - --provider
    - openai-codex
    - --extension
    - /opt/sbx-kit-pi/extensions/agents-postprocessor.ts

agentInstructions:
  filename: AGENTS.md
  content: |
    This is a Docker Sandbox with Docker access and passwordless sudo.

permissions:
  network:
    allow:
      - auth.openai.com
      - chatgpt.com

credentials:
  - service: openai-codex
    description: OAuth credentials used by Pi's OpenAI Codex provider
    oauth:
      tokenEndpoint:
        host: auth.openai.com
        path: /oauth/token
      credentialFile:
        path: "~/.pi/agent/auth.json"
        structure:
          openai-codex:
            type: oauth
            access: "{{.AccessToken}}"
            refresh: "{{.RefreshToken}}"
            expires: "{{.ExpiresAt}}"
      responseFields:
        accessToken: access_token
        refreshToken: refresh_token
        expiresIn: expires_in
        scope: scope
      passthrough: true

environment:
  variables:
    PI_SKIP_VERSION_CHECK: "1"
    PI_TELEMETRY: "0"
