schemaVersion: "2"
kind: sandbox
name: pi-openai-codex
displayName: Pi (OpenAI Codex)
description: Pi coding agent configured for OpenAI Codex OAuth

sandbox:
  image: docker/sandbox-templates:shell-docker
  entrypoint:
    - pi
    - --provider
    - openai-codex

agentInstructions:
  filename: AGENTS.md
  content: |
    This is a Docker Sandbox with Docker access and passwordless sudo.

permissions:
  network:
    allow:
      - registry.npmjs.org
      - pi.dev
      - auth.openai.com
      - chatgpt.com

credentials:
  - service: openai-codex
    description: OAuth credentials used by Pi's OpenAI Codex provider
    oauth:
      tokenEndpoint:
        host: auth.openai.com
        path: /oauth/token
      credentialFile:
        path: "~/.pi/agent/auth.json"
        structure:
          openai-codex:
            type: oauth
            access: "{{.AccessToken}}"
            refresh: "{{.RefreshToken}}"
            expires: "{{.ExpiresAt}}"
      responseFields:
        accessToken: access_token
        refreshToken: refresh_token
        expiresIn: expires_in
        scope: scope
      passthrough: true

environment:
  variables:
    PI_AGENT_VERSION: "0.84.2"
    PI_SKIP_VERSION_CHECK: "1"
    PI_TELEMETRY: "0"

setup:
  install:
    - command: |
        set -eu
        export npm_config_proxy="${HTTP_PROXY:-}"
        export npm_config_https_proxy="${HTTPS_PROXY:-${HTTP_PROXY:-}}"
        attempt=1
        delay=2
        until npm install -g --ignore-scripts --no-audit --no-fund --maxsockets=1 --fetch-timeout=600000 "@earendil-works/pi-coding-agent@${PI_AGENT_VERSION}"; do
          if [ "$attempt" -ge 5 ]; then
            echo "Pi installation failed after $attempt attempts" >&2
            exit 1
          fi
          echo "Pi installation failed; retrying in ${delay}s ($attempt/5)..." >&2
          sleep "$delay"
          attempt=$((attempt + 1))
          delay=$((delay * 2))
        done
        installed_version=$(pi --version)
        if [ "$installed_version" != "$PI_AGENT_VERSION" ]; then
          echo "Expected Pi $PI_AGENT_VERSION, but installed $installed_version" >&2
          exit 1
        fi
      user: "1000"
      description: Install the pinned Pi release globally (with bounded retries)
